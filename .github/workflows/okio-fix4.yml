name: okio-fix4 verification
on:
  push:
    branches: ['gha-run/okio-fix4']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false -Dkotlin.incremental=false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4
      - name: Baseline public API regressions
        run: |
          df -h /
          ./gradlew -Dkjs=false -Dknative=false -Dkwasm=false :okio-fakefilesystem:jvmTest --tests FakeFileSystemRejectedResizeTest --tests FakeFileSystemReplacementPublicationTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okio-fix4-baseline
          path: '**/build/test-results/**/*.xml'
